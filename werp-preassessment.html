<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WERP Pre-Assessment | LEAP Growths Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
:root{--bg:#f3f8f9;--card:#fff;--ink:#1e2f38;--mute:#5b6b73;--navy:#0a3543;--teal:#136e80;--gold:#c8963e;--line:#d7e6e9;--soft:#eef6f7;--g:#1f9d6b;--b:#136e80;--o:#c8963e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a20;--card:#12272f;--ink:#e6f1f3;--mute:#9db7be;--navy:#e6f1f3;--teal:#4cc0d3;--line:#25424c;--soft:#0f222a;--g:#3ccf97;--b:#4cc0d3;--o:#e0ad57}}
:root[data-theme="dark"]{--bg:#0b1a20;--card:#12272f;--ink:#e6f1f3;--mute:#9db7be;--navy:#e6f1f3;--teal:#4cc0d3;--line:#25424c;--soft:#0f222a;--g:#3ccf97;--b:#4cc0d3;--o:#e0ad57}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.logo{display:inline-block;background:#fff;border-radius:12px;padding:6px 10px;margin-bottom:14px}.logo img{height:38px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 6px 20px rgba(10,53,67,.07);margin-bottom:14px}
h1{font-size:26px;line-height:1.25;margin:4px 0 8px;color:var(--navy)}h2{font-size:20px;margin:4px 0 6px;color:var(--navy)}h3{font-size:15px;margin:0 0 4px;color:var(--navy)}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
p{margin:6px 0;color:var(--mute);font-size:14px}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--teal),var(--gold))}
.q{padding:14px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}.q b{font-weight:500;font-size:14.5px;color:var(--ink);display:block;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.o{font:inherit;font-weight:600;padding:11px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.o:hover{border-color:var(--teal)}.o.on{background:var(--teal);border-color:var(--teal);color:#fff}
.leg{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:6px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:8px}
.btn{font:inherit;font-weight:600;font-size:14px;padding:12px 22px;border-radius:12px;border:0;cursor:pointer;background:var(--teal);color:#fff}
.btn.alt{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=email],input[type=tel]{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);margin:6px 0 8px}
.follow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.fb{display:block;text-align:center;text-decoration:none;color:#fff;font-weight:600;font-size:14px;padding:14px 12px;border-radius:14px}.fb span{display:block;font-size:11px;font-weight:400;opacity:.9}.fb.ig{background:linear-gradient(135deg,#f58529,#dd2a7b 55%,#8134af)}.fb.li{background:#0a66c2}.fb:hover{filter:brightness(1.08)}
@media(max-width:480px){.follow{grid-template-columns:1fr}}
.hero{background:linear-gradient(135deg,#0a3543,#136e80);color:#fff;border-radius:18px;padding:24px;margin-bottom:14px}.hero h1,.hero p{color:#fff}.hero p{opacity:.92}
.score{font-size:44px;font-weight:700;color:var(--gold);line-height:1}
.row{margin:16px 0}.rh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:14px;font-weight:500;margin-bottom:6px}
.pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;color:#fff;white-space:nowrap}
.pill.g{background:var(--g)}.pill.b{background:var(--b)}.pill.o{background:var(--o)}
.fill{display:block;height:100%;border-radius:8px}.fill.g{background:var(--g)}.fill.b{background:var(--b)}.fill.o{background:var(--o)}
.focus{border-left:5px solid var(--gold);background:var(--soft);border-radius:12px;padding:12px 14px;margin:10px 0}.focus p{margin:2px 0}
.links a{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--soft);color:var(--ink);text-decoration:none;margin-top:8px;font-size:14px;font-weight:500}
.links a:hover{outline:1.5px solid var(--teal)}.links span{font-size:11px;display:block;color:var(--mute);font-weight:400}
.note{font-size:11.5px;text-align:center;color:var(--mute);margin-top:14px}
@media print{.nav,.noprint{display:none!important}body{background:#fff}}
</style>
</head>

async function saveAssessment() {
  // Calculate each WERP area score (0–100)
  const scores = A.map((a, i) => {
    return Math.round(
      (ans[i].reduce((x, y) => x + y, 0) - 4) / 16 * 100
    );
  });

  // Calculate overall score
  const overallScore = Math.round(
    scores.reduce((x, y) => x + y, 0) / scores.length
  );

  const payload = {
    name: name,
    email: email,
    phone: phone,
    overallScore: overallScore,
    scores: scores,
    answers: ans,
    submittedAt: new Date().toISOString()
  };

  // Do not try to submit until the Apps Script URL has been configured.
  if (
    !GOOGLE_SCRIPT_URL ||
    GOOGLE_SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbzyy7bucMMfd9HxdSQedTFeSlMDfzK5nR6k9Uq3OAKh0KcKqAEC_SOEY5wKULR5J8cK/exec'
  ) {
    console.warn('Google Sheets connection is not configured yet.');
    return;
  }

  try {
    // text/plain avoids a CORS preflight with the Apps Script Web App.
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload)
    });

    console.log('WERP assessment submitted to Google Sheets.');
  } catch (error) {
    // The report should still be shown even if the network request fails.
    console.error('WERP Google Sheets submission failed:', error);
  }
}

  saveAssessment();
